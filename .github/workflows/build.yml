name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build signed APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          { grep -E "^e: " build.log; grep -A4 "What went wrong" build.log; } | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SpamShield.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpamShield-${{ github.run_number }}
          path: SpamShield.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spam Shield 1.0.${{ github.run_number }}
          body: Install SpamShield.apk on your phone. It updates the app in place and keeps your lists and settings.
          files: SpamShield.apk
          make_latest: true
